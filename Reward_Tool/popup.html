<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Rewards Ultra Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0a0a1a;
      --bg-glass: rgba(255, 255, 255, 0.03);
      --bg-glass-hover: rgba(255, 255, 255, 0.06);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-1: #6366f1;
      --accent-2: #a855f7;
      --accent-3: #ec4899;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #475569;
    }

    body {
      width: 340px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
      animation: bgFloat 15s ease-in-out infinite;
    }

    @keyframes bgFloat {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      33% {
        transform: translate(3%, 2%) rotate(1deg);
      }

      66% {
        transform: translate(-2%, 3%) rotate(-1deg);
      }
    }

    .container {
      padding: 20px;
      position: relative;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
      }

      50% {
        box-shadow: 0 0 20px 5px rgba(168, 85, 247, 0.3);
      }
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .version-badge {
      display: inline-block;
      padding: 3px 10px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      font-size: 10px;
      color: var(--text-dim);
      backdrop-filter: blur(10px);
    }

    /* Status Card */
    .status-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .status-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-value.ready {
      color: var(--text);
    }

    .status-value.running {
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.ready {
      background: var(--text-dim);
    }

    .status-dot.running {
      background: var(--success);
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 11px;
      color: var(--success);
    }

    /* Premium Progress Bar */
    .progress-wrap {
      margin-top: 16px;
      display: none;
    }

    .progress-wrap.active {
      display: block;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* Mode Selector */
    .mode-section {
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mode-btn {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .mode-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .mode-btn:hover {
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      border-color: var(--accent-1);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }

    .mode-btn.active::before {
      opacity: 0.1;
    }

    .mode-icon {
      font-size: 24px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .mode-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      position: relative;
      z-index: 1;
    }

    .mode-btn.active .mode-name {
      color: var(--text);
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, var(--danger));
      color: white;
      display: none;
    }

    .btn-ghost {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-dim);
    }

    .btn-ghost:hover {
      background: var(--bg-glass-hover);
      color: var(--text);
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-glass);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Ripple Effect */
    .btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      transform: scale(0);
      opacity: 0;
      transition: transform 0.5s, opacity 0.3s;
    }

    .btn:active::after {
      transform: scale(2);
      opacity: 1;
      transition: 0s;
    }
  </style>
</head>

<body>
  <div class="bg-animation"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span class="logo-text">Ultra Pro</span>
      </div>
      <div class="version-badge">v4.1.0 Stealth</div>
    </div>

    <!-- Status Card -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Trạng thái</span>
        <div class="status-value ready" id="statusValue">
          <span class="status-dot ready" id="statusDot"></span>
          <span id="statusText">Sẵn sàng</span>
        </div>
      </div>

      <div id="phaseRow" style="display: none;">
        <span class="phase-badge" id="phaseBadge">
          <span id="phaseIcon">💻</span>
          <span id="phaseText">PC Mode</span>
        </span>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-info">
          <span id="progressLabel">Đang search...</span>
          <span id="progressCount">0/0</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Mode Selector -->
    <div class="mode-section">
      <div class="section-label">Chế độ tìm kiếm</div>
      <div class="mode-grid">
        <div class="mode-btn" data-mode="pc_only">
          <div class="mode-icon">💻</div>
          <div class="mode-name">PC Only</div>
        </div>
        <div class="mode-btn active" data-mode="both">
          <div class="mode-icon">🔄</div>
          <div class="mode-name">Both</div>
        </div>
        <div class="mode-btn" data-mode="mobile_only">
          <div class="mode-icon">📱</div>
          <div class="mode-name">Mobile</div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="startBtn">
        <span>🚀</span>
        <span>Bắt đầu</span>
      </button>
      <button class="btn btn-danger" id="stopBtn">
        <span>⏹️</span>
        <span>Dừng lại</span>
      </button>
      <button class="btn btn-ghost" id="optionsBtn">
        <span>⚙️</span>
        <span>Cài đặt nâng cao</span>
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label">Hôm nay</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="pointsCount">0</div>
        <div class="stat-label">Điểm</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="streakCount">0</div>
        <div class="stat-label">Streak</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
