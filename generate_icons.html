<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
</head>
<body>
    <h2>Đang tạo icon... vui lòng đợi và cho phép tải xuống nếu được hỏi.</h2>
    <script>
        function downloadIcon(size, text) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Vẽ nền tròn màu xanh gradient
            const grd = ctx.createLinearGradient(0, 0, size, size);
            grd.addColorStop(0, "#0078D4"); // Bing Blue
            grd.addColorStop(1, "#004275");
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, 2 * Math.PI);
            ctx.fill();

            // Vẽ chữ R (Rewards)
            ctx.fillStyle = "white";
            ctx.font = `bold ${size * 0.6}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, size/2, size/2 + (size * 0.05));

            // Tải xuống
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Tạo 3 size icon
        setTimeout(() => downloadIcon(16, "R"), 500);
        setTimeout(() => downloadIcon(48, "R"), 1000);
        setTimeout(() => downloadIcon(128, "R"), 1500);
    </script>
</body>
</html>
